[package]
name = "perigauge"
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.85"
description = "Battery levels of wireless peripherals on the Linux desktop"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
